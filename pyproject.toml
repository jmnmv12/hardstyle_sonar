[project]
name = "hardstyle-sonar"
version = "0.1.0"
description = "Scraping + synchronization program behind the Hardstyle Sonar playlist"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.12.3",
    "bs4==0.0.2",
    "python-dotenv==1.0.1",
    "requests==2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legacy", "playlist", "scraper", "utils"]
